name: iOS Release (NSPIRE Inspection)

# Manual trigger only -- this uploads a real build to App Store Connect / TestFlight,
# so it should never fire automatically on a push.
on:
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        run: npm install

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPSTORE_API_KEY_P8 }}" > ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Bump build number
        working-directory: mobile-app/ios/App
        run: |
          agvtool new-version -all "${{ github.run_number }}"

      - name: Archive
        working-directory: mobile-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
            archive

      - name: Export IPA
        working-directory: mobile-app/ios/App
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }}

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/App.ipa" \
            -t ios \
            --apiKey ${{ secrets.APPSTORE_KEY_ID }} \
            --apiIssuer ${{ secrets.APPSTORE_ISSUER_ID }} 2>&1 | tee "$RUNNER_TEMP/altool.log"
          # altool prints its failures and still exits 0, so a rejected upload
          # finished as a green run with nothing on TestFlight -- which is how a
          # closed version train went unnoticed until someone went looking for a
          # build that was never there.
          #
          # Insist on the success line rather than hunting for the word "error":
          # altool announces success as "UPLOAD SUCCEEDED with no errors", and
          # searching for "error" duly failed a perfectly good upload.
          if ! grep -q "UPLOAD SUCCEEDED" "$RUNNER_TEMP/altool.log"; then
            echo "::error::altool did not report a successful upload - see its output above"
            exit 1
          fi

      - name: Upload build artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/App.xcarchive
          retention-days: 5
