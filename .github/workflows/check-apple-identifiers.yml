name: Check Apple Identifiers Access
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Try to find/create a Services ID
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          npm install jsonwebtoken@9
          node <<'EOF'
          const jwt = require('jsonwebtoken');
          const KEY_ID = process.env.APPSTORE_KEY_ID;
          const ISSUER_ID = process.env.APPSTORE_ISSUER_ID;
          const PRIVATE_KEY = process.env.APPSTORE_API_KEY_P8;
          const API = 'https://api.appstoreconnect.apple.com/v1';
          function makeToken() {
            return jwt.sign({ iss: ISSUER_ID, aud: 'appstoreconnect-v1' }, PRIVATE_KEY, { algorithm: 'ES256', expiresIn: '19m', header: { kid: KEY_ID, typ: 'JWT' } });
          }
          async function api(path, opts = {}) {
            const res = await fetch(`${API}${path}`, { ...opts, headers: { Authorization: `Bearer ${makeToken()}`, 'Content-Type': 'application/json', ...(opts.headers||{}) } });
            const text = await res.text();
            let body; try { body = JSON.parse(text); } catch { body = text; }
            console.log(opts.method || 'GET', path, '->', res.status);
            console.log(JSON.stringify(body, null, 2).slice(0, 1500));
            return { status: res.status, body };
          }
          async function main() {
            // Look for an existing Services ID identifier of type SERVICES_ID
            await api('/bundleIds?filter[identifier]=com.inspireintern.app.sid');
            console.log('---trying create---');
            await api('/bundleIds', {
              method: 'POST',
              body: JSON.stringify({
                data: {
                  type: 'bundleIds',
                  attributes: {
                    name: 'NSPIRE Sign in with Apple',
                    identifier: 'com.inspireintern.app.sid',
                    platform: 'IOS',
                  },
                },
              }),
            });
          }
          main().catch(e => { console.error('ERR', e.message); process.exit(1); });
          EOF
