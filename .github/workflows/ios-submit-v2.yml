name: iOS Submit via reviewSubmissions API

# The older appStoreVersionSubmissions resource our other workflow uses is
# deprecated and our API key is only allowed to DELETE on it. This uses the
# current reviewSubmissions API instead: find (or create) the open submission
# for the app, make sure the version is an item on it, then flip it to
# submitted.
on:
  workflow_dispatch: {}

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit via reviewSubmissions
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          npm install jsonwebtoken@9
          node <<'EOF'
          const jwt = require('jsonwebtoken');

          const KEY_ID = process.env.APPSTORE_KEY_ID;
          const ISSUER_ID = process.env.APPSTORE_ISSUER_ID;
          const PRIVATE_KEY = process.env.APPSTORE_API_KEY_P8;
          const BUNDLE_ID = 'com.nspireapp';
          const API = 'https://api.appstoreconnect.apple.com/v1';

          function makeToken() {
            return jwt.sign(
              { iss: ISSUER_ID, aud: 'appstoreconnect-v1' },
              PRIVATE_KEY,
              { algorithm: 'ES256', expiresIn: '19m', header: { kid: KEY_ID, typ: 'JWT' } }
            );
          }

          async function api(path, opts = {}) {
            const res = await fetch(`${API}${path}`, {
              ...opts,
              headers: {
                Authorization: `Bearer ${makeToken()}`,
                'Content-Type': 'application/json',
                ...(opts.headers || {}),
              },
            });
            const text = await res.text();
            let body;
            try { body = text ? JSON.parse(text) : {}; } catch { body = { raw: text }; }
            if (!res.ok) {
              throw new Error(`${opts.method || 'GET'} ${path} -> ${res.status}: ${JSON.stringify(body)}`);
            }
            return body;
          }

          async function main() {
            const apps = await api(`/apps?filter[bundleId]=${BUNDLE_ID}`);
            const appId = apps.data?.[0]?.id;
            if (!appId) throw new Error('App not found for bundle id ' + BUNDLE_ID);
            console.log('app id:', appId);

            // Which version are we trying to get reviewed?
            const versions = await api(`/apps/${appId}/appStoreVersions?limit=20`);
            const target = (versions.data || []).find((v) =>
              ['READY_FOR_REVIEW', 'PREPARE_FOR_SUBMISSION', 'REJECTED', 'DEVELOPER_REJECTED', 'METADATA_REJECTED'].includes(v.attributes.appStoreState)
            );
            if (!target) throw new Error('No version in a submittable state. States: ' + (versions.data || []).map((v) => v.attributes.appStoreState).join(', '));
            console.log('target version:', target.attributes.versionString, target.attributes.appStoreState, target.id);

            // Existing open submissions for this app.
            let submissions;
            try {
              submissions = await api(`/apps/${appId}/reviewSubmissions?filter[state]=READY_FOR_REVIEW,WAITING_FOR_REVIEW,IN_REVIEW,UNRESOLVED_ISSUES&limit=20`);
            } catch (e) {
              console.log('  could not list submissions:', e.message);
              submissions = { data: [] };
            }
            for (const s of submissions.data || []) {
              console.log('  submission', s.id, s.attributes.state, 'platform', s.attributes.platform);
            }

            let submission = (submissions.data || []).find((s) => s.attributes.state === 'READY_FOR_REVIEW');

            if (!submission) {
              console.log('No open READY_FOR_REVIEW submission; creating one...');
              const created = await api('/reviewSubmissions', {
                method: 'POST',
                body: JSON.stringify({
                  data: {
                    type: 'reviewSubmissions',
                    attributes: { platform: 'IOS' },
                    relationships: { app: { data: { type: 'apps', id: appId } } },
                  },
                }),
              });
              submission = created.data;
              console.log('created submission', submission.id);
            }

            // Make sure the version is actually an item on the submission.
            let items = { data: [] };
            try {
              items = await api(`/reviewSubmissions/${submission.id}/items?limit=20`);
            } catch (e) {
              console.log('  could not list items:', e.message);
            }
            const hasVersion = (items.data || []).some((i) => i.relationships?.appStoreVersion?.data?.id === target.id);
            console.log('items on submission:', (items.data || []).length, '| includes target version:', hasVersion);

            if (!hasVersion) {
              console.log('Adding version as a submission item...');
              await api('/reviewSubmissionItems', {
                method: 'POST',
                body: JSON.stringify({
                  data: {
                    type: 'reviewSubmissionItems',
                    relationships: {
                      reviewSubmission: { data: { type: 'reviewSubmissions', id: submission.id } },
                      appStoreVersion: { data: { type: 'appStoreVersions', id: target.id } },
                    },
                  },
                }),
              });
              console.log('  added.');
            }

            console.log('Submitting...');
            const done = await api(`/reviewSubmissions/${submission.id}`, {
              method: 'PATCH',
              body: JSON.stringify({
                data: { type: 'reviewSubmissions', id: submission.id, attributes: { submitted: true } },
              }),
            });
            console.log('RESULT state:', done.data?.attributes?.state);
            console.log('SUBMITTED OK');
          }

          main().catch((e) => { console.error('FAILED', e.message); process.exit(1); });
          EOF
