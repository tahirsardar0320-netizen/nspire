name: iOS Submit via reviewSubmissions API

# The older appStoreVersionSubmissions resource our other workflow uses is
# deprecated and our API key is only allowed to DELETE on it. Version 2.8 is
# already an item on the existing submission, so this just flips that
# submission to submitted and clears away any stray empty submission.
on:
  workflow_dispatch: {}

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit via reviewSubmissions
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          npm install jsonwebtoken@9
          node <<'EOF'
          const jwt = require('jsonwebtoken');

          const KEY_ID = process.env.APPSTORE_KEY_ID;
          const ISSUER_ID = process.env.APPSTORE_ISSUER_ID;
          const PRIVATE_KEY = process.env.APPSTORE_API_KEY_P8;
          const BUNDLE_ID = 'com.nspireapp';
          const API = 'https://api.appstoreconnect.apple.com/v1';
          const EXISTING_SUBMISSION = '3bbdabcb-6605-41dc-b83f-65c48dd40115';

          function makeToken() {
            return jwt.sign(
              { iss: ISSUER_ID, aud: 'appstoreconnect-v1' },
              PRIVATE_KEY,
              { algorithm: 'ES256', expiresIn: '19m', header: { kid: KEY_ID, typ: 'JWT' } }
            );
          }

          async function api(path, opts = {}) {
            const res = await fetch(`${API}${path}`, {
              ...opts,
              headers: {
                Authorization: `Bearer ${makeToken()}`,
                'Content-Type': 'application/json',
                ...(opts.headers || {}),
              },
            });
            const text = await res.text();
            let body;
            try { body = text ? JSON.parse(text) : {}; } catch { body = { raw: text }; }
            if (!res.ok) {
              throw new Error(`${opts.method || 'GET'} ${path} -> ${res.status}: ${JSON.stringify(body)}`);
            }
            return body;
          }

          async function main() {
            const apps = await api(`/apps?filter[bundleId]=${BUNDLE_ID}`);
            const appId = apps.data?.[0]?.id;
            console.log('app id:', appId);

            // Clear away any empty submission left behind by an earlier run —
            // an extra open submission confuses the App Store Connect UI.
            let list = { data: [] };
            try {
              list = await api(`/apps/${appId}/reviewSubmissions?limit=50`);
            } catch (e) {
              console.log('  could not list submissions:', e.message);
            }
            for (const s of list.data || []) {
              console.log('  submission', s.id, s.attributes.state);
            }
            for (const s of list.data || []) {
              if (s.id === EXISTING_SUBMISSION) continue;
              if (s.attributes.state !== 'READY_FOR_REVIEW') continue;
              let count = 0;
              try {
                const its = await api(`/reviewSubmissions/${s.id}/items?limit=5`);
                count = (its.data || []).length;
              } catch { /* assume empty */ }
              if (count === 0) {
                try {
                  await api(`/reviewSubmissions/${s.id}`, { method: 'DELETE' });
                  console.log('  deleted empty submission', s.id);
                } catch (e) {
                  console.log('  could not delete', s.id, e.message);
                }
              }
            }

            console.log('Submitting existing submission', EXISTING_SUBMISSION, '...');
            const done = await api(`/reviewSubmissions/${EXISTING_SUBMISSION}`, {
              method: 'PATCH',
              body: JSON.stringify({
                data: { type: 'reviewSubmissions', id: EXISTING_SUBMISSION, attributes: { submitted: true } },
              }),
            });
            console.log('RESULT state:', done.data?.attributes?.state);
            console.log('SUBMITTED OK');
          }

          main().catch((e) => { console.error('FAILED', e.message); process.exit(1); });
          EOF
