name: iOS Submit via reviewSubmissions API

# The older appStoreVersionSubmissions resource the other workflow uses is
# closed to CREATE for our API key, so submission goes through the current
# reviewSubmissions API: find (or open) a submission, make sure the version
# we want reviewed is an item on it, then mark it submitted.
on:
  workflow_dispatch: {}

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit the in-flight version for review
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          npm install jsonwebtoken@9
          node <<'EOF'
          const jwt = require('jsonwebtoken');
          const BUNDLE_ID = 'com.nspireapp';
          const SUBMITTABLE = ['PREPARE_FOR_SUBMISSION', 'REJECTED', 'DEVELOPER_REJECTED', 'METADATA_REJECTED', 'INVALID_BINARY'];
          const WHATS_NEW = [
            'Faster photo capture during inspections — photos now attach instantly.',
            'Signing in with Google or Apple stays inside the app and returns automatically.',
            'Fixed navigation that could take you out of the app unexpectedly.',
            'General stability improvements.',
          ].join('\n');

          const token = () => jwt.sign(
            { iss: process.env.APPSTORE_ISSUER_ID, aud: 'appstoreconnect-v1' },
            process.env.APPSTORE_API_KEY_P8,
            { algorithm: 'ES256', expiresIn: '19m', header: { kid: process.env.APPSTORE_KEY_ID, typ: 'JWT' } }
          );

          async function api(path, opts = {}) {
            const res = await fetch(`https://api.appstoreconnect.apple.com/v1${path}`, {
              ...opts,
              headers: {
                Authorization: `Bearer ${token()}`,
                'Content-Type': 'application/json',
                ...(opts.headers || {}),
              },
            });
            const body = res.status === 204 ? null : await res.json();
            if (!res.ok) throw new Error(`${opts.method || 'GET'} ${path} -> ${res.status}: ${JSON.stringify(body)}`);
            return body;
          }

          async function main() {
            const apps = await api(`/apps?filter[bundleId]=${BUNDLE_ID}`);
            const appId = apps.data[0].id;

            const versions = await api(`/apps/${appId}/appStoreVersions?limit=20`);
            const version = (versions.data || []).find((v) => SUBMITTABLE.includes(v.attributes.appStoreState));
            if (!version) {
              throw new Error('No version is waiting to be submitted. States: ' +
                (versions.data || []).map((v) => `${v.attributes.versionString}=${v.attributes.appStoreState}`).join(', '));
            }
            console.log(`Version to submit: ${version.attributes.versionString} (${version.attributes.appStoreState})`);

            // A version with no build attached is rejected at the last step with
            // "The build associated with appStoreVersions ... was not found",
            // which says nothing about what to do. Uploading to TestFlight does
            // not attach anything; the version has to point at a build itself.
            const current = await api(`/appStoreVersions/${version.id}/relationships/build`).catch(() => null);
            if (current?.data?.id) {
              console.log(`Build already attached: ${current.data.id}`);
            } else {
              const builds = await api(
                `/builds?filter[app]=${appId}&filter[preReleaseVersion.version]=${version.attributes.versionString}` +
                `&filter[processingState]=VALID&limit=1&sort=-uploadedDate`
              );
              const build = builds.data?.[0];
              if (!build) {
                throw new Error(
                  `No processed build found for version ${version.attributes.versionString}. ` +
                  'Upload one with the iOS Release workflow and wait for Apple to finish processing it.'
                );
              }
              await api(`/appStoreVersions/${version.id}/relationships/build`, {
                method: 'PATCH',
                body: JSON.stringify({ data: { type: 'builds', id: build.id } }),
              });
              console.log(`Attached build ${build.attributes.version} (${build.id})`);
            }

            // Reuse an open submission if there is one; a second open submission
            // confuses the App Store Connect UI.
            const subs = await api(`/apps/${appId}/reviewSubmissions?limit=50`);
            let submission = (subs.data || []).find((s) => s.attributes.state === 'READY_FOR_REVIEW');

            if (submission) {
              console.log(`Reusing open submission ${submission.id}`);
            } else {
              const created = await api('/reviewSubmissions', {
                method: 'POST',
                body: JSON.stringify({
                  data: {
                    type: 'reviewSubmissions',
                    attributes: { platform: 'IOS' },
                    relationships: { app: { data: { type: 'apps', id: appId } } },
                  },
                }),
              });
              submission = created.data;
              console.log(`Opened submission ${submission.id}`);
            }

            // An update — unlike a first release — is rejected without release
            // notes, and the API surfaces that only once you try to submit.
            const locs = await api(`/appStoreVersions/${version.id}/appStoreVersionLocalizations?limit=20`);
            for (const loc of locs.data || []) {
              if ((loc.attributes.whatsNew || '').trim()) continue;
              await api(`/appStoreVersionLocalizations/${loc.id}`, {
                method: 'PATCH',
                body: JSON.stringify({
                  data: {
                    type: 'appStoreVersionLocalizations',
                    id: loc.id,
                    attributes: { whatsNew: WHATS_NEW },
                  },
                }),
              });
              console.log(`Set release notes for ${loc.attributes.locale}`);
            }

            const items = await api(`/reviewSubmissions/${submission.id}/items?limit=20`);
            const alreadyThere = (items.data || []).some(
              (i) => i.relationships?.appStoreVersion?.data?.id === version.id
            );

            if (alreadyThere) {
              console.log('Version is already an item on this submission.');
            } else {
              await api('/reviewSubmissionItems', {
                method: 'POST',
                body: JSON.stringify({
                  data: {
                    type: 'reviewSubmissionItems',
                    relationships: {
                      reviewSubmission: { data: { type: 'reviewSubmissions', id: submission.id } },
                      appStoreVersion: { data: { type: 'appStoreVersions', id: version.id } },
                    },
                  },
                }),
              });
              console.log('Added the version to the submission.');
            }

            const done = await api(`/reviewSubmissions/${submission.id}`, {
              method: 'PATCH',
              body: JSON.stringify({
                data: { type: 'reviewSubmissions', id: submission.id, attributes: { submitted: true } },
              }),
            });
            console.log('RESULT state:', done.data?.attributes?.state);

            const after = await api(`/apps/${appId}/appStoreVersions?limit=5`);
            (after.data || []).forEach((v) =>
              console.log(`  version ${v.attributes.versionString} | state: ${v.attributes.appStoreState}`)
            );
          }
          main().catch((e) => { console.error('FAILED', e.message); process.exit(1); });
          EOF
