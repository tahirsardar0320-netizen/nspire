name: Check Play Store Status
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check production track status
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          pip install pyjwt cryptography
          echo "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > /tmp/sa.json
          python3 <<'EOF'
          import json, time, urllib.request, urllib.parse, urllib.error
          import jwt

          PACKAGE_NAME = "com.nspireapp"
          API_BASE = "https://androidpublisher.googleapis.com/androidpublisher/v3"

          sa = json.load(open('/tmp/sa.json'))
          now = int(time.time())
          payload = {
              "iss": sa["client_email"],
              "scope": "https://www.googleapis.com/auth/androidpublisher",
              "aud": "https://oauth2.googleapis.com/token",
              "iat": now, "exp": now + 3600,
          }
          assertion = jwt.encode(payload, sa["private_key"], algorithm="RS256")
          data = urllib.parse.urlencode({
              "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
              "assertion": assertion,
          }).encode()
          req = urllib.request.Request("https://oauth2.googleapis.com/token", data=data)
          token = json.load(urllib.request.urlopen(req))["access_token"]

          def api(method, path, body=None):
              url = f"{API_BASE}{path}"
              hdrs = {"Authorization": f"Bearer {token}"}
              b = None
              if body is not None:
                  b = json.dumps(body).encode()
                  hdrs["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=b, method=method, headers=hdrs)
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  print(f"ERROR {method} {path}: {e.code} {e.read().decode()}")
                  return None

          edit = api("POST", f"/applications/{PACKAGE_NAME}/edits")
          edit_id = edit["id"]
          print("edit:", edit_id)

          print("\n=== App details ===")
          details = api("GET", f"/applications/{PACKAGE_NAME}/edits/{edit_id}/details")
          print(json.dumps(details, indent=2))

          print("\n=== Production track ===")
          prod = api("GET", f"/applications/{PACKAGE_NAME}/edits/{edit_id}/tracks/production")
          print(json.dumps(prod, indent=2))

          print("\n=== All tracks ===")
          tracks = api("GET", f"/applications/{PACKAGE_NAME}/edits/{edit_id}/tracks")
          print(json.dumps(tracks, indent=2))

          # Clean up the edit we created just to read state
          api("POST", f"/applications/{PACKAGE_NAME}/edits/{edit_id}:validate")
          EOF
