name: TEMP - Revoke stale CI certificates

on:
  workflow_dispatch: {}

jobs:
  revoke:
    runs-on: ubuntu-latest
    steps:
      - name: Revoke development certificates created by CI runs
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          npm install jsonwebtoken@9
          node <<'EOF'
          const jwt = require('jsonwebtoken');
          const token = () => jwt.sign(
            { iss: process.env.APPSTORE_ISSUER_ID, aud: 'appstoreconnect-v1' },
            process.env.APPSTORE_API_KEY_P8,
            { algorithm: 'ES256', expiresIn: '19m', header: { kid: process.env.APPSTORE_KEY_ID, typ: 'JWT' } }
          );

          async function api(path, method = 'GET') {
            const res = await fetch(`https://api.appstoreconnect.apple.com/v1${path}`, {
              method,
              headers: { Authorization: `Bearer ${token()}` },
            });
            if (method === 'DELETE') {
              if (!res.ok) throw new Error(`${path} -> ${res.status}: ${await res.text()}`);
              return null;
            }
            const body = await res.json();
            if (!res.ok) throw new Error(`${path} -> ${res.status}: ${JSON.stringify(body)}`);
            return body;
          }

          // Only ever touch development certificates that Xcode minted on a
          // throwaway CI runner. A distribution certificate, or anything named
          // after a real person, is left alone no matter what.
          const isDisposableCiCert = (c) =>
            c.attributes.certificateType === 'DEVELOPMENT' &&
            c.attributes.name === 'Apple Development: Created via API';

          async function main() {
            const certs = await api('/certificates?limit=200');
            const all = certs.data || [];
            const doomed = all.filter(isDisposableCiCert);
            const kept = all.filter((c) => !isDisposableCiCert(c));

            console.log('KEEPING:');
            kept.forEach((c) => console.log(`  ${c.attributes.certificateType}  ${c.id}  ${c.attributes.name}`));

            console.log(`\nREVOKING ${doomed.length} stale CI development certificates:`);
            for (const c of doomed) {
              await api(`/certificates/${c.id}`, 'DELETE');
              console.log(`  revoked ${c.id}  (expired ${c.attributes.expirationDate})`);
            }

            const after = await api('/certificates?limit=200');
            console.log(`\nREMAINING TOTAL: ${(after.data || []).length}`);
            (after.data || []).forEach((c) => console.log(`  ${c.attributes.certificateType}  ${c.id}  ${c.attributes.name}`));
          }
          main().catch((e) => { console.error('FAILED', e.message); process.exit(1); });
          EOF
